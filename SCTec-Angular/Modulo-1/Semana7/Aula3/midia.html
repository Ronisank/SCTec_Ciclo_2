<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias</title>
</head>
<body>
    <div>
        <header>
            <h1>Midias para HTML</h1>
        </header>
        <section>
            <div class="audios">
                <h2>Audios exemplos</h2>
                <div>
                    <audio controls="controls"
                    <source src="https://samplelib.com/mp3/sample-speech-1m.mp3" type="audio/mp3"></audio>
                </div>
                <div class="videos">
                    <h2>Videos Exemplos</h2>
                    <div>
                        <video controls="controls"><source src="https://samplelib.com/mp4/sample-10s-720p.mp4" type="video/mp4" width="360" height="400"></video>
                    </div>
                    <div>
                       <iframe width="720" height="560" src="https://www.youtube.com/embed/k85mRPqvMbE?list=RDk85mRPqvMbE" title="Crazy Frog - Axel F (Official Video)" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                     <div class="imagem">
                <h2>Imagem exemplos</h2>
                <div>
                    <img controls="controls"
                    <source src="https://picsum.photos/720/720" alt="Texto da imagem"></img>
                </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
