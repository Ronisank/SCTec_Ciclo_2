<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
  </head>
  <body>
    <table border="1">
      <caption>
        Exemplo tabela 1
      </caption>
      <!-- Linha de Cabeçalho -->
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Profissão</th>
      </tr>
      <!-- Primeira Linha de Dados -->
      <tr>
        <td>Ana Silva</td>
        <td>28</td>
        <td>Engenheira</td>
      </tr>
      <!-- Segunda Linha de Dados -->
      <tr>
        <td>Carlos Souza</td>
        <td>35</td>
        <td>Designer</td>
      </tr>
    </table>
    <hr />
    <table border="1" cellpadding="8" cellspacing="0">
      <caption>
        Exemplo tabela 2
      </caption>
      <tr>
        <th>Nome:</th>
        <td>Ana Silva</td>
        <td>Carlos Souza</td>
      </tr>
      <tr>
        <th>Idade:</th>
        <td>28 anos</td>
        <td>35 anos</td>
      </tr>
      <tr>
        <th>Profissão:</th>
        <td>Engenheira</td>
        <td>Designer</td>
      </tr>
    </table>
  </body>
</html>
