<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style copy.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="./images/pokebola.png" type="image/x-icon">
    <script src="script.js" defer></script>
    <title>PokeDex</title>
</head>
<body>
    <div class="container">
        <div class="containerInput">
            <input type="text" id="inputPesquisa" class="inputPesquisa"/>
            <button type="button" class="btnPesquisa">Procurar</button>
        </div>
            
        <div class="cardPokemon">
            <img class="pokeBola" src="images/pokebola.png">
            <span id="nomePokemon"></span>
            <img class="pokemon" src="" id="imgPokemon" alt="Nome Pokemon"></img>
            <span id="tipo"></span>
            <span id="altura"></span>
            <span id="peso"></span>
            
        </div>
        <div class="containerBtns">

            <button type="button" class="btnAnt">Anterior</button>
            <button type="button" class="btnPro">Próximo</button>
        </div>
            
    </div>
</body>
</html>
