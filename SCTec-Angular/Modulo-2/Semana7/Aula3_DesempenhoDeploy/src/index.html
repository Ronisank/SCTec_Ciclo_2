<!doctype html>
<!--
  index.html - a ÚNICA página HTML do projeto (por isso Angular é uma SPA: Single Page Application).
  O navegador abre este arquivo e o Angular "desenha" toda a aplicação dentro de <app-root>.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Projeto Angular SCTEC</title>
    <!-- base href="/": ponto de partida das rotas (/contato, /cadastro...) -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Semana 7 · Aula 3 (SEO): resumo da página que aparece no Google -->
    <meta name="description" content="Portal do Aluno SCTEC: catálogo de cursos, inscrições e cadastro de alunos. Projeto Angular da turma Desenvolvedor Front-End." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- TODO 2 - parte C: abra a conexão com o servidor das imagens ANTES de precisar delas:
      <link rel="preconnect" href="https://picsum.photos" />
      <link rel="preconnect" href="https://fastly.picsum.photos" />
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- <app-root> é o seletor do componente raiz (src/app/app.ts). Tudo aparece aqui dentro. -->
    <app-root></app-root>
  </body>
</html>
