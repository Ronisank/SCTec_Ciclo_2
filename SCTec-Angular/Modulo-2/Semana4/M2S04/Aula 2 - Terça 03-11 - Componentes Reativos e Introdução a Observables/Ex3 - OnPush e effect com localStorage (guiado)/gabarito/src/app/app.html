<main class="pagina">
  <h1>{{ titulo }}</h1>
  <app-resumo-biblioteca />
  <!-- NOVO: volta ao acervo original e limpa o que foi emprestado -->
  <button (click)="restaurar()">Restaurar acervo</button>
  <!-- [( )] = two-way binding com model(): o pai escreve e lê o mesmo signal -->
  <app-busca-livro [(termo)]="termoBusca" />
  <section class="grade">
    @for (livro of livrosFiltrados(); track livro.id) {
      <!-- agora [livro] alimenta um input() signal do filho -->
      <app-card-livro [livro]="livro" (emprestar)="emprestar($event)" (devolver)="devolver($event)" />
    } @empty {
      <p>Nenhum livro encontrado para "{{ termoBusca() }}".</p>
    }
  </section>
</main>
