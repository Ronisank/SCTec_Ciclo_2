<main class="container">
  <header>
    <h1>Mini Tarefas</h1>
    
      <!-- 👉 TODO 7C: coloque aqui um botão que chama o service: -->
         <button (click)="service.carregar()">Recarregar do servidor</button>
   
  </header>

  <app-resumo />
  <app-formulario />

  
    <!--! 👉 TODO 7D (estados da tela com signals do service):  -->

       @if (service.carregando()) {
         <p class="aviso">Carregando tarefas...</p>
       }

       <!--! TODO 7D: Estado de erro -->
       
       @if (service.erro()) {
         <p class="erro">
           {{ service.erro() }}
           <button (click)="service.carregar()">Tentar novamente</button>
         </p>
       }
 

  <app-lista />
</main>

<app-toast />
