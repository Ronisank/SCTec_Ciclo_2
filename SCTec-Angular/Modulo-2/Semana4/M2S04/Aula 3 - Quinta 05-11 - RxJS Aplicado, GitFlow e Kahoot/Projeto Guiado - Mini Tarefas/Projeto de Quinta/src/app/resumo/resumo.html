<section class="resumo">
  <!--! (signals no template): Signal se lê chamando como função: EX.: service.total()-->
  <div>
    <strong>{{ service.total() }}</strong
    ><span>Total</span>
  </div>
  <div>
    <strong>{{ service.pendentes() }}</strong
    ><span>Pendentes</span>
  </div>
  <div>
    <strong>{{ service.concluidas() }}</strong
    ><span>Concluídas</span>
  </div>

  <div class="barra">
    <div class="barra-preenchida" [style.width.%]="percentual()"></div>
  </div>
  <small>{{ percentual() }}% concluído</small>
</section>
