<app-page-header
  titulo="Cursos SCTEC"
  subtitulo="Catálogo de formações com mat-card (Angular Material) dentro do grid responsivo da Aula 2."
  tag="{{ cursos().length }} cursos"
/>

  TODO 4 (MAT-CARD) - troque o <article class="card curso"> por um <mat-card>:
    <mat-card appearance="outlined" class="curso">
      <img mat-card-image [src]="curso.imagem" [alt]="'Capa do curso ' + curso.nome" loading="lazy" />
      <mat-card-header>
        <mat-card-title>{{ curso.nome }}</mat-card-title>
        <mat-card-subtitle>{{ curso.area }} · {{ curso.nivel }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ curso.descricao }}</p>
      </mat-card-content>
      <mat-card-actions>
        <span class="carga" matTooltip="Carga horária total do curso">
          <mat-icon>schedule</mat-icon> {{ curso.cargaHoraria }} h
        </span>
        <a mat-flat-button routerLink="/alunos/cadastro">Inscrever</a>
      </mat-card-actions>
    </mat-card>
  O lista-cursos.scss já está pronto (o grid da Aula 2 continua igual).
-->
<div class="lista">
  @for (curso of cursos(); track curso.id) {
    <article class="card curso">
      <img [src]="curso.imagem" [alt]="'Capa do curso ' + curso.nome" loading="lazy" />
      <div class="conteudo">
        <span class="tag">{{ curso.area }}</span>
        <h3>{{ curso.nome }}</h3>
        <p>{{ curso.descricao }}</p>
        <small>{{ curso.nivel }} · {{ curso.cargaHoraria }} h</small>
      </div>
    </article>
  } @empty {
    <p class="aviso">Nenhum curso para mostrar.</p>
  }
</div>
