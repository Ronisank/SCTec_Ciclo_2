<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Aula1/Styles/atividades.css">
    <script src="index.js" defer></script>
    <title>Tabela Dinâmica</title>
</head>
<body>
    <header>
        <h1>Tabela Dinâmica</h1>
    </header>
    <main>
        <table border="1">
            <thead>
                <tr>
                    <th rowspan="2">Disciplina</th>
                    <th colspan="2">Notas</th>
                    <th rowspan="2">Média</th>
                    <th rowspan="2">Frequência</th>
                    <th rowspan="2">Situação</th>
                </tr>
                <tr>
                        <th>1º Bim</th>
                        <th>2º Bim</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
    
</body>
</html>
