<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../Aula2/style.css" />
    <script src="index.js" defer></script>
    <link
      rel="shortcut icon"
      href="../../Semana7/Aula2/favicon.ico"
      type="image/x-icon"
    />
    <title>CADASTRO</title>
  </head>
  <body>
    <main class="card-login">
      <h3>CADASTRO DE USUÁRIO</h3>
      <form>
        <div class="card-cadastro">
          <label for="nome">Nome</label>
          <input type="text" placeholder="Digite seu nome" id="nome" />

          <label for="email">Email</label>
          <input type="email" placeholder="Digite seu email" id="email" />

          <label for="celular">Celular</label>
          <input type="text" placeholder="(99)9999-99999" id="celular" />
        </div>
        <div>
          <button
            id="cadastro"
            class="cadastrar"
            type="submit"
            onclick="cadastrarUsuario(event)"
          >
            Cadastrar
          </button>
          <button id="voltar" type="button" class="cadastrar">
            <a href="../../Aula2/login.html">Voltar</a>
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
