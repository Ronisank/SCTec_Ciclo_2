<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="calculadora.js" defer></script>
    <link rel="stylesheet" href="calculadora.css" />
    <link rel="shortcut icon" href="imgCalculadora.png" type="image/x-icon">
    <title>Calculadora</title>
  </head>
  <body>
    <div>
      <h1>CALCULADORA</h1>
    </div>
    <main>
      <div>
        <span></span>
      </div>
      <div class="numeros">
        <button class="numero" id="b7">7</button>
        <button class="numero" id="b8">8</button>
        <button class="numero" id="b9">9</button>
        <button class="operador" id="bDiv">/</button>
        <button class="numero" id="b4">4</button>

        <button class="numero" id="b5">5</button>
        <button class="numero" id="b6">6</button>
        <button class="operador" id="bX">x</button>
        <button class="numero" id="b1">1</button>
        <button class="numero" id="b2">2</button>

        <button class="numero" id="b3">3</button>
        <button class="operador" id="bMenos">-</button>
        <button class="numero" id="bPonto">.</button>
        <button class="numero" id="b0">0</button>
        <button id="bC" class="limpar" onclick="limpar()">C</button>
        <button class="operador" id="bMais">+</button>

        <button type="button" id="bigual" class="primeira" onclick="calcular()">=</button>
      </div>
    </main>
    <footer class="rodape">
      <div class="contato-nome">Desenvolvido por: Roni Rodrigues - 2026 

        <div class="contato">Contatos:<a href="https://https://www.linkedin.com/in/roni-rodrigues" target="_blank" rel="noopener noreferrer"><img src="../Aula3/assets/imgs/linkedin.png" alt="Imagem link para o linkedin"></a><a href="https://https://github.com/ronisank" target="_blank" rel="noopener noreferrer"><img src="../Aula3/assets/imgs/img github.png" alt="imagem link para o github"></a></div>
      </div>
    </footer>
  </body>
</html>
