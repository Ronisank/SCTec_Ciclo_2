<app-titulo-pagina titulo="Contatos" subtitulo="A lista reage sozinha a cada mudança (Observables)">
  <a mat-flat-button routerLink="/contatos/novo"><mat-icon>person_add</mat-icon> Novo contato</a>
</app-titulo-pagina>

<mat-form-field appearance="outline">
  <mat-label>Buscar por nome ou e-mail</mat-label>
  <mat-icon matPrefix>search</mat-icon>
  <input matInput [formControl]="busca" placeholder="Ex.: ana" />
</mat-form-field>
